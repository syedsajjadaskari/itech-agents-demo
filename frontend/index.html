<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Smart Support</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; }

    .box {
      width: 420px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 560px;
      overflow: hidden;
    }

    .header {
      background: #0078d4;
      color: white;
      padding: 18px 20px;
    }
    .header h2 { font-size: 16px; }
    .header p  { font-size: 12px; opacity: 0.8; margin-top: 3px; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 80%;
      font-size: 14px;
      line-height: 1.5;
    }
    .bubble.user    { background: #0078d4; color: white; align-self: flex-end; }
    .bubble.bot     { background: #f0f0f0; color: #222;  align-self: flex-start; }
    .bubble.support { background: #fff3e0; color: #222;  align-self: flex-start; }

    .tag {
      font-size: 10px;
      color: #888;
      align-self: flex-start;
      margin-bottom: -6px;
      margin-left: 2px;
    }
    .tag.support { color: #e65100; }

    .input-row {
      display: flex;
      padding: 12px;
      border-top: 1px solid #eee;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #0078d4; }
    button {
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled { background: #aaa; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="box">
  <div class="header">
    <h2>Smart Support Agent</h2>
    <p>Powered by Azure AI Foundry</p>
  </div>

  <div class="messages" id="msgs">
    <div class="bubble bot">Hi! Ask me about refunds, shipping, payments, or any issue.</div>
  </div>

  <div class="input-row">
    <input id="inp" placeholder="Type your question..." />
    <button id="btn" onclick="send()">Send</button>
  </div>
</div>

<script>
  async function send() {
    const inp = document.getElementById("inp");
    const btn = document.getElementById("btn");
    const text = inp.value.trim();
    if (!text) return;

    addBubble(text, "user", null);
    inp.value = "";
    btn.disabled = true;

    try {
      const res  = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      const data = await res.json();
      addBubble(data.reply, data.agent, data.agent);
    } catch {
      addBubble("Something went wrong. Please try again.", "bot", null);
    }

    btn.disabled = false;
  }

  function addBubble(text, cssClass, agentType) {
    const msgs = document.getElementById("msgs");

    if (agentType === "support") {
      const tag = document.createElement("div");
      tag.className = "tag support";
      tag.textContent = "Support Agent";
      msgs.appendChild(tag);
    } else if (agentType === "faq") {
      const tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = "FAQ Agent";
      msgs.appendChild(tag);
    }

    const div = document.createElement("div");
    div.className = `bubble ${cssClass}`;
    div.textContent = text;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  document.getElementById("inp").addEventListener("keypress", e => {
    if (e.key === "Enter") send();
  });
</script>
</body>
</html>
